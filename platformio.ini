; PlatformIO wrapper for the native ESP-IDF project.
; The authoritative build is the root ESP-IDF CMake project.

[platformio]
default_envs = cardputer_adv_idf
src_dir = main

[env:cardputer_adv_idf]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = espidf

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, colorize

board_build.flash_mode = qio
board_build.partitions = partitions_5m_spiffs_8mb.csv
board_upload.maximum_size = 2686976

lib_deps =
    m5stack/M5GFX@^0.2.21
    m5stack/M5Unified@^0.2.15
lib_ignore =
    M5Cardputer
    arduino-nofrendo
    M5GFX
    M5Unified

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DREMOVE_PRINTF
    ; Optional logging flags. Enable by removing the leading ';'.
    -DEMU_LOGS_ENABLED
    -DBOOT_DIAG_LOGS
    ; -DAUDIO_LOGS
    ; -DMD_LOGS
    ; -DMD_AUDIO_LOGS
    ; -DMD_RENDER_LOGS
    ; -DSNES_LOGS
    ; -DNES_DIAG_LOGS
    ; -DNES_BENCHMARK_LOGS
    ; -DWS_LOGS_ENABLED
    ; -DWS_BENCHMARK_LOGS
    ; -DWS_RENDER_PROFILE
    ; -DWS_CPU_PROFILE
    ; -DWS_CPU_BRANCH_PROFILE
    ; -DWS_TILE_ROW_CACHE=1
    ; -DWS_TILE_ROW_CACHE_ENTRIES=2048
    ; -DWS_APU_IRAM=1
    ; -DWS_CORE_IRAM=1
    ; -DWS_AUDIO_PERIOD_MS=10
    ; -DWS_AUDIO_DMA_LEN=640
    ; -DWS_AUDIO_DMA_COUNT=8
    ; -DNGP_TRACE_LOGS
    ; -DCOLECO_DEBUG_LOGS
    ; -DBENCHMARK_LOGS
    ; -DEMU_ALLOW_RAW_PRINTF
    -DWS_PPU_IRAM=1
    -Wno-implicit-fallthrough
    -Wno-maybe-uninitialized
    -Wno-unused-label
    -Wno-unused-function
    -Wno-unused-but-set-variable
    -Wno-unused-variable
    -Wno-array-bounds
    -Wno-dangling-else
    -Wno-format-truncation
    -Wno-misleading-indentation
    -Wno-comment
    -Wno-stringop-overflow
