; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-stamps3]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
lib_deps = 
    ; Cardputer library is in /lib folder
    m5stack/M5Cardputer@^1.0.3
    m5stack/M5Unified@^0.2.11
    bodmer/TFT_eSPI@^2.5.43
    
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = dio
board_build.f_cpu = 270000000L

monitor_filters = esp32_exception_decoder, colorize

; Load the script to apply C-only flags safely
extra_scripts = pre:apply_c_flags.py

build_unflags =
    -Os
    -Og
    -g
    -fno-jump-tables
    -fno-rtti

build_flags =
    ; Race (NGP)
    -Isrc/ngp/race
    -DUSE_CZ80=1
    -D USER_SETUP_LOADED=1
    -D USE_ILI9341
    -include src/tft_setup.h
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCZ80=1
    -DUSE_SDL=1
    -DDISABLE_WATCHDOGS
    ;-DUSE_PARITY_TABLE ; Existing speed hack for NGP, possible compatibility issues, use at own risk
    -DNGP_USE_THREADED_COLORMAPPING    
    ;-DFRAMESKIP ; Enable auto-frameskip, this at most can gain 2-3fps while skipping 25% of frames. Large penalty for little gain.
    ;-DNGP_INTERLACED ; Enable interlaced rendering mode for display output
    -DNGP_ONLY_RENDER_VISIBLE_LINES ; Disbales rendering of lines that arent visible due to scaling
    ;-DNGP_HW_INTERLACED ; Skip every other line that would normally be rendered by the emulator
    -DNGP_OPTIMIZATION_16BIT_READ ; 16-bit reads with alignment check for native bus transactions
    ; GWENESIS
    -DGNW_TARGET_MARIO=0
    -DGNW_TARGET_ZELDA=0
    ; -DGENESIS_NO_SOUND ; Disable sound support
    -UROM_SWAP
    -URAM_SWAP
    -Isrc/genesis/gwenesis
    -Isrc/genesis/gwenesis/bus
    -Isrc/genesis/gwenesis/cpus
    -Isrc/genesis/gwenesis/io
    -Isrc/genesis/gwenesis/sound
    -Isrc/genesis/gwenesis/savestate
    -Isrc/genesis/gwenesis/vdp
    -Isrc/genesis/gwenesis/cpus
    -Isrc/genesis/gwenesis/cpus/M68K
    -Isrc/genesis/gwenesis/cpus/Z80

    ; Oswan
    -DWS_SAVE_ENABLED=1

    ; Stella (Atari 2600)
    -Isrc/atari2600
    -Isrc/atari2600/stella/common
    -Isrc/atari2600/stella/emucore
    -Isrc/atari2600/stella/gui
    -DSOUND_SUPPORT=1
    -DJUMP_TABLES_IN_TEXT_SECTION=1
    -fexceptions

    ; SNES
    -DNO_ZERO_LUT
    -DSNES_NO_SOUND
    -DSNES_NO_APU
    ; -DSNES_NO_BYTE2000
    ; -DSNES_NO_THREADED_DISPLAY
    -DSNES_NO_THREADED_INPUT

    -Wl,-Map,firmware.map
    -Wl,--cref
    -Wl,--print-memory-usage
    
    -O2
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -mlongcalls
    -DCORE_DEBUG_LEVEL=0
    -DLOG_LOCAL_LEVEL=ESP_LOG_WARN
    -DNDEBUG
    -fno-exceptions
    -fexceptions
    -fno-rtti
    -fuse-linker-plugin

    -Wl,--wrap=bmp_create ; nofrendo
    -Wl,--wrap=bmp_destroy ; nofrendo


build_src_flags =
    -O3
    -g0 
    -fno-tree-slp-vectorize
    -fomit-frame-pointer
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
    -fno-plt             ; reduces indirect branch overhead 
    -Wno-stack-protector


;board_build.partitions  = partitions_5m_spiffs_8mb.csv
;board_build.partitions = huge_app.csv
board_build.partitions = partitions_dual_screen.csv

[env:m5stack-stamps3-max-spiffs]
extends = env:m5stack-stamps3
board_build.partitions = partitions_a2600_8mb.csv
board_build.flash_mode = dio
