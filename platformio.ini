; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-stamps3-max-spiffs

[env:m5stack-stamps3]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
lib_deps = 
    ; Cardputer library is in /lib folder
    m5stack/M5Cardputer@^1.0.3
    m5stack/M5Unified@^0.2.11
    bodmer/TFT_eSPI@^2.5.43
    
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = dio
board_build.f_cpu = 270000000L

monitor_filters = esp32_exception_decoder, colorize

; Load the script to apply C-only flags safely
extra_scripts = pre:apply_c_flags.py

build_unflags =
    -Os
    -Og
    -g
    -fno-jump-tables
    -fno-rtti

build_flags =
    -D USER_SETUP_LOADED=1
    -D USE_ILI9341
    -include src/tft_setup.h
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_SDL=1
    -DDISABLE_WATCHDOGS

    ; MSX
    -Isrc/msx
    -Isrc/msx/core
    -DMSX_AUDIO_ENABLED=1
    -DMSX_YM2413_ENABLED=0
    -Wl,-Map,firmware.map
    -Wl,--cref
    -Wl,--print-memory-usage
    
    -O2
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -mlongcalls
    -DCORE_DEBUG_LEVEL=0
    -DLOG_LOCAL_LEVEL=ESP_LOG_WARN
    -DNDEBUG
    -fno-exceptions
    -fno-rtti
    -fuse-linker-plugin
    

build_src_flags =
    -O3
    -g0 
    -fno-tree-slp-vectorize
    -fomit-frame-pointer
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
    -fno-plt             ; reduces indirect branch overhead 
    -Wno-stack-protector

build_src_filter =
    +<*>
    -<nes/>
    -<sms/>
    -<coleco/>
    -<ngp/>
    -<videopac/>
    -<ws/>
    -<pce/>
    -<lynx/>
    -<genesis/>
    -<gbc/>
    -<snes/>

; Use the largest app partition for every active environment.
board_build.partitions = partitions_a2600_8mb.csv
board_build.embed_files =
    bios/cbios-0.29a/roms/cbios_main_msx1.rom
    bios/cbios-0.29a/roms/cbios_sub.rom

[env:m5stack-stamps3-max-spiffs]
extends = env:m5stack-stamps3
board_build.flash_mode = dio





